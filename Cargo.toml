[package]
name = "git-trim"
description = "Automatically trims your tracking branches whose upstream branches are merged or stray"
license = "MIT"
version = "0.4.4"
authors = ["SeongChan Lee <foriequal@gmail.com>"]
repository = "https://github.com/foriequal0/git-trim"
readme = "README.md"
keywords = ["git", "branch", "prune", "trim"]
categories = ["command-line-utilities", "development-tools"]
edition = "2021"
rust-version = "1.65"
build = "build.rs"
default-run = "git-trim"

[[bin]]
name = "build-man"
required-features = ["build-man"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
build-man = ["man"]

[build-dependencies]
anyhow = "1.0.104"
vergen-gix = { version = "10.0.3", features = ["build", "cargo", "rustc", "si"] }

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.8", features = ["derive"] }
crossbeam-channel = "0.5.17"
dialoguer = "0.12.0"
env_logger = "0.11.11"
git2 = "0.21.0"
log = "0.4.35"
man = { version = "0.3.0", optional = true }
rayon = "1.12.0"
textwrap = { version = "0.16.4", features = ["terminal_size"] }
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"
