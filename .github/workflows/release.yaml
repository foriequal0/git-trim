name: Release

on:
  push:
    tags:
      - v*

jobs:
  upload-artifacts:
    runs-on: ${{ matrix.os.long }}
    strategy:
      matrix:
        os:
          - long: ubuntu-latest
            short: linux
          - long: macOS-latest
            short: mac
          - long: windows-latest
            short: win
    steps:
      - uses: actions/checkout@v7
      - run: cargo fetch --verbose
      - run: cargo build --release
      - name: Archive
        shell: bash
        working-directory: target/release
        run: |
          VERSION="${{github.ref}}"
          VERSION="${VERSION#refs/tags/}"
          ARCHIVE="git-trim-${{matrix.os.short}}-$VERSION.tgz"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "ARCHIVE=$ARCHIVE" >> $GITHUB_ENV

          rm -rf artifacts
          mkdir -p artifacts/git-trim
          cp 'git-trim' artifacts/git-trim/
          echo '${{github.sha}} ${{github.ref}}' | tee artifacts/git-trim/git-ref

          if command -v sha256sum; then
              sha256sum 'git-trim' | tee artifacts/git-trim/sha256sums
          else
              shasum -a 256 'git-trim' | tee artifacts/git-trim/sha256sums
          fi

          cd artifacts
          tar cvzf "$ARCHIVE" git-trim
      - uses: actions/upload-artifact@v7
        with:
          name: git-trim-${{matrix.os.short}}-${{env.VERSION}}
          path: target/release/artifacts/${{env.ARCHIVE}}

  github-release:
    needs:
      - upload-artifacts
    runs-on: ubuntu-latest
    steps:
      - run: |
          VERSION="${{github.ref}}"
          VERSION="${VERSION#refs/tags/}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - uses: actions/download-artifact@v7
        with:
          name: git-trim-linux-${{env.VERSION}}
          path: ./
      - uses: actions/download-artifact@v7
        with:
          name: git-trim-mac-${{env.VERSION}}
          path: ./
      - uses: actions/download-artifact@v7
        with:
          name: git-trim-win-${{env.VERSION}}
          path: ./

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ github.ref }}
          tag_name: ${{ github.ref }}
          draft: true
          prerelease: true
          preserve_order: true
          files: |
            ./git-trim-linux-${{env.VERSION}}.tgz
            ./git-trim-mac-${{env.VERSION}}.tgz
            ./git-trim-win-${{env.VERSION}}.tgz

  cargo-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo fetch --verbose
      - name: Cargo publish
        run: |
          cargo publish --token ${{ secrets.CRATES_IO_TOKEN }}
